<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FundAgent AI · 智能基金研究 Agent</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#e3e6ea; --text:#1f2329; --sub:#646a73;
    --primary:#3370ff; --primary-light:#e1eaff; --red:#f54a45; --green:#34a853;
    --node:#7c5cfc; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  #app{display:flex;height:100vh}
  /* ---------- 左侧 ---------- */
  .side{width:250px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
  .side .brand{padding:16px;font-weight:700;font-size:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .side .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
  .side .userbox{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--sub)}
  .side .userbox b{color:var(--text);font-size:13px}
  .quick{padding:12px 16px;border-bottom:1px solid var(--border)}
  .quick h4{font-size:12px;color:var(--sub);margin-bottom:8px}
  .quick button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px;font-size:12px;border:1px solid var(--border);border-radius:8px;background:#fafbfc;cursor:pointer;color:var(--text)}
  .quick button:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
  .sessions{flex:1;overflow-y:auto;padding:8px}
  .sessions h4{font-size:12px;color:var(--sub);padding:4px 8px 8px}
  .session-item{padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .session-item:hover{background:#f0f2f5}
  .session-item.active{background:var(--primary-light);color:var(--primary)}
  .session-item .st{font-size:10px;color:var(--sub);margin-left:6px}
  /* ---------- 中间 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;font-size:13px;color:var(--sub)}
  .topbar .badge{font-size:11px;background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:10px}
  #messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:78%;padding:10px 14px;border-radius:var(--radius);font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;background:#eef2f6;color:var(--sub);font-size:12px;padding:6px 12px}
  .msg .meta{font-size:11px;color:var(--sub);margin-bottom:6px}
  .inputbar{border-top:1px solid var(--border);background:var(--panel);padding:12px 16px;display:flex;gap:10px}
  .inputbar textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;font-family:inherit;height:46px;outline:none}
  .inputbar textarea:focus{border-color:var(--primary)}
  .inputbar button{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:0 22px;font-size:14px;cursor:pointer}
  .inputbar button:disabled{background:#a8c0ff;cursor:not-allowed}
  /* ---------- 右侧 ---------- */
  .panel{width:320px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .tabs{display:flex;border-bottom:1px solid var(--border)}
  .tabs div{flex:1;text-align:center;padding:10px 0;font-size:12.5px;cursor:pointer;color:var(--sub)}
  .tabs div.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:600}
  .tabpage{flex:1;overflow-y:auto;padding:14px;display:none}
  .tabpage.active{display:block}
  .flow-step{display:flex;gap:8px;font-size:12px;padding:7px 10px;border-radius:8px;margin-bottom:6px;background:#f7f8fa;border:1px solid var(--border)}
  .flow-step .n{color:var(--node);font-weight:700;min-width:86px}
  .flow-step .m{color:var(--text);flex:1}
  .review-card{border:1px solid #ffb800;background:#fff8e6;border-radius:10px;padding:14px;margin-bottom:12px}
  .review-card h4{font-size:13px;margin-bottom:8px;color:#b26a00}
  .review-card p{font-size:12px;color:var(--text);margin-bottom:4px}
  .review-card textarea{width:100%;height:52px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12px;margin:8px 0;font-family:inherit;resize:none}
  .review-card .btns{display:flex;gap:8px}
  .review-card button{flex:1;padding:7px 0;border:none;border-radius:8px;font-size:12.5px;cursor:pointer}
  .btn-ok{background:var(--green);color:#fff}
  .btn-no{background:#fff;color:var(--red);border:1px solid var(--red)}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .stat{background:#f7f8fa;border:1px solid var(--border);border-radius:8px;padding:10px}
  .stat b{font-size:18px;display:block}
  .stat span{font-size:11px;color:var(--sub)}
  table.mini{width:100%;border-collapse:collapse;font-size:11.5px}
  table.mini th,table.mini td{border:1px solid var(--border);padding:5px 6px;text-align:left}
  table.mini th{background:#f7f8fa;color:var(--sub);font-weight:500}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#eef2f6;color:var(--sub);margin-right:4px}
  .up{color:var(--red);font-weight:600}   /* A股惯例：涨红 */
  .down{color:var(--green);font-weight:600} /* 跌绿 */
  /* ---------- 登录 ---------- */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99}
  .login-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px;width:380px}
  .login-box h1{font-size:20px;margin-bottom:6px}
  .login-box p{font-size:12px;color:var(--sub);margin-bottom:20px}
  .urow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer}
  .urow:hover,.urow.sel{border-color:var(--primary);background:var(--primary-light)}
  .urow .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .urow .info{flex:1}
  .urow .info b{font-size:13px;display:block}
  .urow .info span{font-size:11px;color:var(--sub)}
  .login-box button{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;margin-top:8px}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="login-box">
    <h1>FundAgent AI</h1>
    <p>智能基金研究 Agent 系统 · LangGraph 多 Agent 演示（mock 数据）</p>
    <div id="userlist"></div>
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app" class="hidden">
  <!-- 左侧 -->
  <aside class="side">
    <div class="brand"><span class="dot"></span>FundAgent AI</div>
    <div class="userbox">
      当前用户：<b id="me-name"></b>（<span id="me-role"></span>）<br>
      <span id="me-dept"></span>
    </div>
    <div class="quick">
      <h4>快捷问题</h4>
      <button onclick="quick('查一下贵州茅台最新的财务数据')">📊 查一下贵州茅台最新的财务数据</button>
      <button onclick="quick('帮我分析一下宁德时代的投资价值')">🔍 宁德时代投资价值深度分析</button>
      <button onclick="quick('帮我分析一下新能源主题的投资机会，从数据采集到生成基金报告全流程处理')">🚀 新能源主题全流程（三 Agent 串联）</button>
      <button onclick="quick('对比一下宁德时代和比亚迪')">⚖️ 对比宁德时代和比亚迪</button>
      <button onclick="quick('最新的 CPI 数据对债市有什么影响')">🌐 最新 CPI 对债市的影响</button>
    </div>
    <div class="sessions">
      <h4>历史任务</h4>
      <div id="session-list"></div>
    </div>
  </aside>

  <!-- 中间 -->
  <main class="main">
    <div class="topbar">
      <span>💬 基金研究对话</span>
      <span class="badge" id="task-badge">空闲</span>
      <span id="task-intent"></span>
    </div>
    <div id="messages">
      <div class="msg sys">你好，我是 FundAgent AI。我可以帮你采集数据、分析基金、生成研究报告。试试左侧快捷问题，或直接输入。</div>
    </div>
    <div class="inputbar">
      <textarea id="input" placeholder="输入基金研究需求，如：帮我分析一下宁德时代的投资价值（Enter 发送）"></textarea>
      <button id="send-btn" onclick="send()">发送</button>
    </div>
  </main>

  <!-- 右侧 -->
  <aside class="panel">
    <div class="tabs">
      <div class="active" onclick="switchTab(0)">执行进度</div>
      <div onclick="switchTab(1)">审核 / 报告</div>
      <div onclick="switchTab(2)">看板</div>
    </div>
    <div class="tabpage active" id="tab0">
      <div id="flow"></div>
    </div>
    <div class="tabpage" id="tab1">
      <div id="review-area"></div>
      <div id="report-area"></div>
    </div>
    <div class="tabpage" id="tab2">
      <div class="stat-grid" id="stats"></div>
      <div id="tracking"></div>
    </div>
  </aside>
</div>

<script>
let TOKEN = '', USER = null, THREAD = null, ES = null, BUSY = false;

const $ = id => document.getElementById(id);
const API = location.origin;

/* ---------------- 登录 ---------------- */
const USERS = [
  {user_id:'analyst_001', name:'李文', role:'analyst', dept:'研究所 · 电力设备组', password:'fund2026', desc:'行业研究员'},
  {user_id:'fm_001', name:'王总', role:'fund_manager', dept:'研究所 · 基金管理部', password:'fund2026', desc:'基金经理（可审核）'},
  {user_id:'ic_001', name:'陈委', role:'committee', dept:'研究所 · 投资决策委员会', password:'fund2026', desc:'投委会成员（终审）'},
];
let selUser = USERS[0];
USERS.forEach((u,i)=>{
  const d = document.createElement('div');
  d.className = 'urow' + (i===0?' sel':'');
  d.innerHTML = `<div class="avatar">${u.name[0]}</div><div class="info"><b>${u.name} · ${u.desc}</b><span>${u.user_id} / ${u.dept}</span></div>`;
  d.onclick = ()=>{ selUser=u; document.querySelectorAll('.urow').forEach(e=>e.classList.remove('sel')); d.classList.add('sel'); };
  $('userlist').appendChild(d);
});
async function doLogin(){
  const r = await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:selUser.user_id,password:selUser.password})});
  const data = await r.json();
  if(!data.token) return alert('登录失败');
  TOKEN = data.token; USER = data.user;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('me-name').textContent = USER.name;
  $('me-role').textContent = {analyst:'研究员',fund_manager:'基金经理',committee:'投委会'}[USER.role];
  $('me-dept').textContent = USER.department_id;
  refreshSessions(); refreshDashboard();
}
async function api(path, opts={}){
  opts.headers = Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}, opts.headers||{});
  const r = await fetch(API+path, opts);
  return r.json();
}

/* ---------------- 会话 ---------------- */
async function refreshSessions(){
  const data = await api('/api/tasks');
  const box = $('session-list'); box.innerHTML='';
  (data.sessions||[]).forEach(s=>{
    const d = document.createElement('div');
    d.className = 'session-item' + (s.thread_id===THREAD?' active':'');
    d.innerHTML = `${s.title||s.thread_id}<span class="st">${statusText(s.status)}</span>`;
    d.onclick = ()=>{ THREAD = s.thread_id; refreshSessions(); loadHistory(s.thread_id); };
    box.appendChild(d);
  });
}
function statusText(s){ return {active:'进行中',awaiting_review:'待审核',completed:'已完成'}[s]||s; }

async function loadHistory(tid){
  const data = await api('/api/history/'+tid);
  $('messages').innerHTML='';
  (data.messages||[]).forEach(m=>addMsg(m.role==='user'?'user':'bot', m.content));
  subscribeSSE(tid);
}

/* ---------------- 对话 ---------------- */
function addMsg(role, text){
  const d = document.createElement('div');
  d.className = 'msg '+role;
  if(role==='bot') d.innerHTML = `<div class="meta">🤖 FundAgent AI</div>`;
  d.appendChild(document.createTextNode(text));
  $('messages').appendChild(d);
  $('messages').scrollTop = $('messages').scrollHeight;
  return d;
}
function quick(q){ $('input').value = q; send(); }

async function send(){
  const q = $('input').value.trim();
  if(!q || BUSY) return;
  BUSY = true; $('send-btn').disabled = true;
  addMsg('user', q);
  $('input').value = '';
  $('flow').innerHTML = '';
  $('review-area').innerHTML = '';
  $('task-badge').textContent = '执行中';
  const data = await api('/api/chat', {method:'POST', body:JSON.stringify({message:q, thread_id:THREAD})});
  THREAD = data.thread_id;
  addMsg('sys', `任务已启动（thread_id: ${THREAD}），右侧实时查看节点执行进度`);
  subscribeSSE(THREAD);
  refreshSessions();
}
function subscribeSSE(tid){
  if(ES) ES.close();
  ES = new EventSource(`${API}/api/chat/stream?thread_id=${tid}&token=${TOKEN}`);
  ES.onmessage = ev=>{
    const e = JSON.parse(ev.data);
    if(e.type==='progress'){
      addFlow(e);
      if(e.node==='human_review' && e.review_required){ showReview(e.review_payload); }
    } else if(e.type==='paused'){
      $('task-badge').textContent = '待审核';
      addMsg('sys', '⏸ ' + e.message);
    } else if(e.type==='final'){
      $('task-badge').textContent = '已完成';
      addMsg('bot', e.message);
      BUSY=false; $('send-btn').disabled=false;
      refreshSessions(); refreshDashboard(); refreshReports();
      ES.close();
    } else if(e.type==='error'){
      $('task-badge').textContent = '失败';
      addMsg('sys', '❌ ' + e.message);
      BUSY=false; $('send-btn').disabled=false; ES.close();
    } else if(e.type==='status'){
      addMsg('sys', e.message);
    }
  };
}
function addFlow(e){
  const d = document.createElement('div');
  d.className = 'flow-step';
  d.innerHTML = `<span class="n">${e.agent||''}</span><span class="m">${e.node||''}：${e.message||''}</span>`;
  $('flow').appendChild(d);
}

/* ---------------- Human-in-the-Loop ---------------- */
function showReview(p){
  const box = $('review-area');
  box.innerHTML = `
    <div class="review-card">
      <h4>⏳ 待审核：${p.stock||''}</h4>
      <p>评级：<b>${p.rating||''}</b> ｜ 目标价：<b>${p.target_price||''}</b> 元 ｜ 上行空间：${p.upside_pct||''}%</p>
      <p>风险等级：${p.risk_level||''}</p>
      <p>投资逻辑：${(p.investment_logic||'').slice(0,80)}</p>
      <textarea id="rv-comments" placeholder="审核意见（退回时必填）"></textarea>
      <div class="btns">
        <button class="btn-ok" onclick="doReview('approve')">✅ 确认通过</button>
        <button class="btn-no" onclick="doReview('reject')">↩️ 退回修改</button>
      </div>
    </div>`;
  switchTab(1);
  addMsg('sys','⏳ 分析结论已生成，等待基金经理确认（LangGraph interrupt 已暂停）');
}
async function doReview(decision){
  const comments = $('rv-comments').value;
  const r = await api(`/api/tasks/${THREAD}/review`, {method:'POST', body:JSON.stringify({decision, comments})});
  addMsg('sys', decision==='approve' ? '✅ 已确认，Agent 继续保存分析结果…' : '↩️ 已退回，Agent 按意见重新生成投资逻辑…');
  $('review-area').innerHTML = '';
}

/* ---------------- 报告 ---------------- */
async function refreshReports(){
  const data = await api('/api/reports');
  const box = $('report-area');
  box.innerHTML = '<h4 style="font-size:12px;color:var(--sub);margin:10px 0 6px">基金报告库</h4>';
  (data.reports||[]).slice(0,10).forEach(r=>{
    const d = document.createElement('div');
    d.className = 'flow-step';
    d.innerHTML = `<span class="m"><b>${r.title}</b><br><span class="tag">${r.report_type}</span><span class="tag">${statusText(r.audit_status)}</span></span>`;
    d.style.cursor='pointer';
    d.onclick = async ()=>{ const det = await api('/api/reports/'+r.report_id); if(det.report) addMsg('bot', det.report.body.slice(0, 1500)); };
    box.appendChild(d);
  });
}

/* ---------------- 看板 ---------------- */
async function refreshDashboard(){
  const d = await api('/api/dashboard');
  $('stats').innerHTML = `
    <div class="stat"><b>${d.reports_total}</b><span>报告总数</span></div>
    <div class="stat"><b style="color:#ffb400">${d.reports_pending}</b><span>待审核</span></div>
    <div class="stat"><b>${d.analysis_total}</b><span>分析记录</span></div>
    <div class="stat"><b>${d.tasks_total}</b><span>研究任务</span></div>`;
  const t = await api('/api/tracking');
  let html = '<h4 style="font-size:12px;color:var(--sub);margin:10px 0 6px">单只基金跟踪（长期记忆）</h4>';
  html += '<table class="mini"><tr><th>标的</th><th>评级</th><th>目标价</th><th>风险</th></tr>';
  (t.tracking||[]).forEach(r=>{ html += `<tr><td>${r.stock_name}</td><td>${r.latest_rating||'-'}</td><td>${r.latest_target_price||'-'}</td><td>${JSON.parse(r.risk_assessments||'{}').overall_risk||'-'}</td></tr>`; });
  html += '</table>';
  $('tracking').innerHTML = html;
}

/* ---------------- Tab ---------------- */
function switchTab(i){
  document.querySelectorAll('.tabs div').forEach((e,j)=>e.classList.toggle('active', i===j));
  document.querySelectorAll('.tabpage').forEach((e,j)=>e.classList.toggle('active', i===j));
  if(i===1) refreshReports();
}

$('input').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
</script>
</body>
</html>
